name: ship

on:
  push:
    branches:
      - develop
      - modern-k8s-provisioner-compat
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/selamanse/dynamic-nfs-provisioner

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test $(go list ./... | grep -v '/tests$')

      - name: Build binary
        run: make provisioner-nfs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: image
        shell: bash
        run: |
          tags="${IMAGE}:latest
          ${IMAGE}:${GITHUB_SHA}"

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            version="${{ github.event.release.tag_name }}"
          else
            version=""
          fi

          if [[ -n "${version}" ]]; then
            tags="${tags}
          ${IMAGE}:${version}"

            if [[ "${version}" == v* ]]; then
              tags="${tags}
          ${IMAGE}:${version#v}"
            fi
          fi

          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: buildscripts/provisioner-nfs/provisioner-nfs.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
